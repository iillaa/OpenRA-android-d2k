name: Android (Dune 2000)

on:
  push:
    branches: [android-native-port]
  pull_request:
    branches: [android-native-port]

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Android Workload
        run: |
          dotnet workload install android
          dotnet workload restore

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Locate and configure Android SDK
        id: sdk
        run: |
          SDKMGR=""
          for path in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/*/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager" \
            "$ANDROID_HOME/embedded/tools/bin/sdkmanager" \
            "$ANDROID_HOME/embedded/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -f "$path" ]; then
              SDKMGR="$(cd "$(dirname "$path")" && pwd)"
              break
            fi
          done
          echo "SDKMGR=$SDKMGR"
          echo "sdkmgr=$SDKMGR" >> "$GITHUB_OUTPUT"

      - name: Accept Android Licenses
        run: |
          yes | "${{ steps.sdk.outputs.sdkmgr }}/sdkmanager" --licenses 2>&1 | grep -E "(accepted|license)" || true

      - name: Install NDK for arm64-v8a
        run: |
          "${{ steps.sdk.outputs.sdkmgr }}/sdkmanager" "ndk;27.0.11902897"
          NDK_DIR=$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)
          echo "NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build native libraries (arm64-v8a)
        run: |
          bash thirdparty/build-android-linux.sh "$NDK_ROOT"

      - name: Verify native libraries
        run: |
          ls -lh OpenRA.Android/jniLibs/arm64-v8a/
          file OpenRA.Android/jniLibs/arm64-v8a/*.so

      - name: Build APK
        run: |
          dotnet build OpenRA.Android/OpenRA.Android.csproj -c Release -f net9.0-android

      - name: Find APK
        id: apk
        run: |
          APK=$(find OpenRA.Android/bin/Release -name "*.apk" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenRA-Dune2000-debug
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
