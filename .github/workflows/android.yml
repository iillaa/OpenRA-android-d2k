name: Android (Dune 2000)

on:
  push:
    branches: [android-native-port]
  pull_request:
    branches: [android-native-port]

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Android Workload
        run: |
          dotnet workload install android
          dotnet workload restore

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: "34.0.0"
          ndk: "27.0.11902897"

      - name: Build native libraries (arm64-v8a)
        run: |
          NDK_PATH="${ANDROID_HOME}/ndk/$(ls "${ANDROID_HOME}/ndk")"
          echo "NDK_PATH=$NDK_PATH"
          bash thirdparty/build-android-linux.sh "$NDK_PATH"

      - name: Verify native libraries
        run: |
          ls -lh OpenRA.Android/jniLibs/arm64-v8a/
          file OpenRA.Android/jniLibs/arm64-v8a/*.so

      - name: Build APK
        run: |
          dotnet build OpenRA.Android/OpenRA.Android.csproj -c Release -f net9.0-android

      - name: Find APK
        id: apk
        run: |
          APK=$(find OpenRA.Android/bin/Release -name "*.apk" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "apk_path=$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenRA-Dune2000-debug
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
