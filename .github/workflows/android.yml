name: Android (Dune 2000)

on:
  push:
    branches: [android-native-port]
  pull_request:
    branches: [android-native-port]

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Install Android Workload
        run: |
          dotnet workload install android
          dotnet workload restore
          echo "/usr/share/android/" > $HOME/Android_SDK_LICENSE 2>/dev/null || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Locate SDK + NDK
        id: sdk
        run: |
          ANDROID_HOME=$(dirname $(dirname $(which dotnet)) 2>/dev/null || echo "$HOME/.local/share/dotnet")
          # dotnet workload installs the Android SDK under the workload packs directory
          SDK_DIR=$(find $HOME/.dotnet/x64 -name "sdk" -type d 2>/dev/null | head -1)
          if [ -z "$SDK_DIR" ]; then
            SDK_DIR=$HOME/Library/Android/sdk
          fi
          echo "sdk_dir=$SDK_DIR"
          echo "ndk_dir=$SDK_DIR/ndk/$(ls $SDK_DIR/ndk 2>/dev/null | head -1)"
          echo "sdk=$SDK_DIR" >> $GITHUB_OUTPUT

      - name: Build native libraries (arm64-v8a)
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.sdk }}
          NDK_ROOT: ${{ steps.sdk.outputs.ndk_dir }}
        run: |
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            echo "NDK not found via workload; installing via sdkmanager"
            ${ANDROID_HOME}/tools/bin/sdkmanager "ndk;27.0.11902897" 2>/dev/null || \
              ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12179864" 2>/dev/null
            NDK_ROOT=${ANDROID_HOME}/ndk/$(ls ${ANDROID_HOME}/ndk | head -1)
          fi
          bash thirdparty/build-android-linux.sh "$NDK_ROOT"

      - name: Verify native libraries
        run: |
          ls -lh OpenRA.Android/jniLibs/arm64-v8a/
          file OpenRA.Android/jniLibs/arm64-v8a/*.so

      - name: Build APK
        run: |
          dotnet build OpenRA.Android/OpenRA.Android.csproj -c Release -f net9.0-android

      - name: Find APK
        id: apk
        run: |
          APK=$(find OpenRA.Android/bin/Release -name "*.apk" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "apk_path=$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenRA-Dune2000-debug
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
